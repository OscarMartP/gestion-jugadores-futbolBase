# Configuración de Koyeb para gestion-jugadores-api
# Este archivo es opcional, la configuración principal se hace desde el dashboard

name: gestion-jugadores-api

services:
  - name: api
    type: web
    build:
      dockerfile: Dockerfile
    ports:
      - port: 8080
        protocol: http
    env:
      - name: SPRING_PROFILES_ACTIVE
        value: prod
      - name: SERVER_PORT
        value: "8080"
    instance:
      type: eco # Tier gratuito (512MB RAM, 0.1 CPU)
    regions:
      - fra # Frankfurt (cerca de España)
    autoscaling:
      min: 1
      max: 1
    healthcheck:
      http:
        port: 8080
        path: /actuator/health
      grace_period: 120 # Spring Boot tarda en arrancar
      interval: 60
      timeout: 10
      restart_limit: 3
