# Database Configuration (DESARROLLO)
# Para producción, usar application-prod.properties con variables de entorno
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/control_jugadores}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:1234}
# Driver auto-detectado por Spring Boot desde la URL JDBC
# spring.datasource.driver-class-name se omite para auto-detección

# JPA Configuration
# Dialecto auto-detectado por Hibernate desde la URL JDBC
# spring.jpa.properties.hibernate.dialect se omite para auto-detección
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
jwt.secret=${JWT_SECRET:examportal_dev_secret_key_change_in_production_minimum_32_chars}
jwt.expiration=${JWT_EXPIRATION:36000000}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100,http://localhost:8101}

# Disable devtools automatic restart to avoid classloader issues with generated mappers
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Logging configuration
logging.level.root=INFO
logging.level.com.gestion.jugadores=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.gestion.jugadores.controlador
springdoc.paths-to-match=/api/v1/**
# OpenAI API Configuration
# Para producción, SIEMPRE usar variable de entorno OPENAI_API_KEY
# Obtén tu API key en: https://platform.openai.com/api-keys
openai.api.key=${OPENAI_API_KEY:tu-api-key-aqui}
openai.api.model=${OPENAI_MODEL:gpt-3.5-turbo}