# PRODUCTION CONFIGURATION
# Las variables de entorno deben configurarse en el servidor de producción

# Database Configuration
# Railway/Neon PostgreSQL configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gestion_jugadores}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Propiedades adicionales para compatibilidad PostgreSQL
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.ssl=true

# HikariCP Configuration (optimizado para conexiones externas como Neon)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Security
jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_IN_PRODUCTION_MINIMUM_64_CHARACTERS_REQUIRED}
jwt.expiration=${JWT_EXPIRATION:36000000}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://tudominio.com}

# Logging Configuration
logging.level.root=INFO
logging.level.com.gestion.jugadores=INFO
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Swagger/OpenAPI Configuration (DESHABILITADO EN PRODUCCIÓN)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Server Configuration
server.error.include-message=never
server.error.include-stacktrace=never
server.port=${PORT:8080}

# Actuator Configuration (para health checks de Fly.io)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.defaults.enabled=true
