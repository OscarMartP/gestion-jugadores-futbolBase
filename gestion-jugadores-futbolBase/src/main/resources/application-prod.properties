# ============================================
# PRODUCCION - Render + Neon PostgreSQL
# Driver PostgreSQL 42.7.3 (compatible SCRAM-SHA-256)
# ============================================

# Database Configuration (PostgreSQL en Neon)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# HikariCP Configuration para Neon PostgreSQL (evita errores SCRAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration - Dominios permitidos en producción
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://your-frontend-app.vercel.app}

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never

# Logging configuration (INFO en producción)
logging.level.root=INFO
logging.level.com.gestion.jugadores=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Swagger Configuration (opcional en producción)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.gestion.jugadores.controlador
springdoc.paths-to-match=/api/v1/**

# Actuator for health checks (Render)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
