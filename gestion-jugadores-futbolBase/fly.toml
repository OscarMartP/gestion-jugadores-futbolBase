# fly.toml - Configuración para Fly.io

app = "gestion-jugadores-api"
primary_region = "mad" # Madrid - cambia a tu región preferida

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "10s"
    method = "get"
    path = "/actuator/health"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  SERVER_PORT = "8080"

# Nota: Las variables sensibles (DATABASE_URL, JWT_SECRET, OPENAI_API_KEY, etc.)
# deben configurarse con: fly secrets set VARIABLE_NAME=valor
